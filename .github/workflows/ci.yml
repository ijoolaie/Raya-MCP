name: Raya MCP CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-node22:
    name: Windows / Node.js 22
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      MCP_ALLOWED_ROOTS: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        run: npm audit

      - name: Syntax checks
        run: npm run lint

      - name: Test MCP and format tools
        run: npm test
