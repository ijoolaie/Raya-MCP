name: Raya MCP CI

on:
  pull_request:
    branches: [main, research/broker-v2-pinned-read-vertical-slice-20261127]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-node22:
    name: Windows / Node.js 22
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      MCP_ALLOWED_ROOTS: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build and test Broker v2 relative-path lexical gate
        shell: cmd
        run: .native-probe/broker-v2-read-ops/build-and-test.cmd

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        run: npm audit

      - name: Syntax checks
        run: npm run lint

      - name: Verify modular package boundaries and clean-install profiles
        run: npm run verify:modular

      - name: Test MCP and format tools
        run: npm test
